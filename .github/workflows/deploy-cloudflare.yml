name: Deploy to Cloudflare

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-cloudflare.yml"
      - "scripts/apply-wrangler-env.mjs"
      - "scripts/setup-deploy/**"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-cloudflare.yml"
      - "scripts/apply-wrangler-env.mjs"
      - "scripts/setup-deploy/**"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @miyulabmd/web build

      - name: Bundle Worker without uploading
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy -c wrangler.og-fetch.toml --dry-run --outdir /tmp/miyulabmd-og-fetch-dry-run
          pnpm exec wrangler deploy -c wrangler.diagram-check.toml --dry-run --outdir /tmp/miyulabmd-diagram-check-dry-run
          pnpm exec wrangler deploy --dry-run --outdir /tmp/miyulabmd-worker-dry-run

  deploy:
    name: Deploy production Worker
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    concurrency:
      group: cloudflare-web-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @miyulabmd/web build

      - name: Apply account-specific wrangler config
        working-directory: apps/worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          OG_FETCH_WORKER_NAME: ${{ vars.OG_FETCH_WORKER_NAME }}
          DIAGRAM_CHECK_WORKER_NAME: ${{ vars.DIAGRAM_CHECK_WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          CUSTOM_HOSTNAME: ${{ vars.CUSTOM_HOSTNAME }}
        run: node ../../scripts/apply-wrangler-env.mjs --require-remote

      - name: Apply D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.deploy.toml

      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy -c wrangler.og-fetch.deploy.toml --message "${{ github.sha }}-og-fetch"
          pnpm exec wrangler deploy -c wrangler.diagram-check.deploy.toml --message "${{ github.sha }}-diagram-check"
          pnpm exec wrangler deploy -c wrangler.deploy.toml --message "${{ github.sha }}"
