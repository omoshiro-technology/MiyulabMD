name = "miyulabmd"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/auth/*",
  "/ws/*",
  "/mcp",
  "/mcp/*",
  "/n/*",
  "/s/*",
  "/openapi.json",
]

[[d1_databases]]
binding = "DB"
database_name = "miyulabmd"
# Remote ID is D1_DATABASE_ID (GitHub Actions variable). Local / dry-run use this placeholder.
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "miyulabmd-images"

[[services]]
binding = "OG_FETCH"
service = "miyulabmd-og-fetch"

[durable_objects]
bindings = [{ name = "DOCUMENT_ROOM", class_name = "DocumentRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentRoom"]

[vars]
ALLOW_ANONYMOUS = "false"
ALLOW_ANONYMOUS_EDITS = "true"
ALLOW_ANONYMOUS_VIEWS = "true"
DEFAULT_PERMISSION = "editable"
# Production value is ACCESS_TEAM_DOMAIN (GitHub Actions variable).
ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"
DEV_AUTH = "false"

# wrangler secret put SESSION_SECRET
# wrangler secret put ACCESS_AUD
